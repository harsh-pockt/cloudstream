name: Desktop Build

on:
  pull_request:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-read-only: ${{ github.event_name == 'pull_request' }}

    - name: Run library tests
      run: ./gradlew :library:jvmTest

    - name: Build MSI
      run: ./gradlew :desktopApp:packageMsi

    - name: Upload MSI
      uses: actions/upload-artifact@v7
      with:
        name: desktop-windows-msi
        path: desktopApp/build/compose/binaries/main/msi/*.msi
        if-no-files-found: error

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: desktop-test-reports
        path: library/build/reports/tests/jvmTest/
