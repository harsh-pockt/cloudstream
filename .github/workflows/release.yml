name: Release

# Publishes the Windows app.
#
# - Every merge into master publishes a pre-release, v<version>-beta.<n>, where <version> is
#   versionName in gradle/libs.versions.toml and <n> follows the last beta of that version.
#   Installed apps find it through the update check in Settings.
# - Pushing a tag v<version> by hand publishes that version as a full release. A tag with a suffix,
#   such as v4.8.0-rc.1, makes a pre-release. After a full release, raise versionName before the next
#   merge: its betas would otherwise come before the release itself.
#
# The release holds the installer and, as THIRD-PARTY-NOTICES.txt promises, the complete source of the
# libmpv-2.dll inside it, copied from the libmpv release the build downloads it from.
#
# Signing, with Azure Artifact Signing: CloudStream.exe is signed, the installer is built around it and
# signed too. It signs once these repository variables are set (Settings > Secrets and variables >
# Actions > Variables), and releases are unsigned until then:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID      the app registration GitHub signs in as, through OpenID
#                                          Connect, so no password or secret is kept here. Its federated
#                                          credential is for the environment "release"
#   ARTIFACT_SIGNING_ENDPOINT             the signing account's region endpoint,
#                                          such as https://eus.codesigning.azure.net/
#   ARTIFACT_SIGNING_ACCOUNT              the signing account's name
#   ARTIFACT_SIGNING_PROFILE              its certificate profile's name

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
    # Path filters only apply to the branch: a tag always releases
    paths-ignore:
      - '*.md'
      - '.github/workflows/libmpv.yml'

permissions:
  contents: write
  # Signing in to Azure with OpenID Connect
  id-token: write

# One release at a time, so two merges close together never pick the same beta number
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    # Azure trusts this repository's "release" environment to sign, whether a merge or a tag runs it
    environment: release
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6

    - name: Choose the version
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version=$(grep -E '^versionName' gradle/libs.versions.toml | cut -d'"' -f2)
        if [[ "$GITHUB_REF_TYPE" == tag ]]; then
          tag=$GITHUB_REF_NAME
          if [[ "${tag#v}" != "$version" && "${tag#v}" != "$version-"* ]]; then
            echo "::error::Tag $tag does not match versionName $version in gradle/libs.versions.toml"
            exit 1
          fi
        else
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already released. Raise versionName in gradle/libs.versions.toml so the next betas come after it"
            exit 1
          fi
          last=$(git ls-remote --tags origin "refs/tags/v$version-beta.*" | sed -E 's|.*/v[^-]*-beta\.([0-9]+)$|\1|' | { grep -E '^[0-9]+$' || true; } | sort -n | tail -1)
          tag=v$version-beta.$(( ${last:-0} + 1 ))
        fi
        # The changes listed in the notes start from the last app release
        previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 50 --json tagName -q '.[].tagName' | grep -E '^v[0-9]' | grep -vx "$tag" | head -1 || true)
        echo "Releasing $tag, changes since ${previous:-the start}"
        echo "TAG=$tag" >> "$GITHUB_ENV"
        echo "PREVIOUS=$previous" >> "$GITHUB_ENV"

    # Before the build, so a release never goes out without the source it promises
    - name: Get the source of the bundled libmpv
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        libmpv=$(grep -o 'releases/download/[^/"]*' desktopApp/build.gradle.kts | head -1 | cut -d/ -f3)
        echo "libmpv comes from release $libmpv"
        mkdir libmpv-source
        gh release download "$libmpv" --repo "$GITHUB_REPOSITORY" --dir libmpv-source --pattern '*-source.7z.*' --pattern '*-sources.txt'
        if ! ls libmpv-source/*-source.7z.001 > /dev/null 2>&1; then
          echo "::error::Release $libmpv has no libmpv source. Build libmpv with the libmpv workflow (publish) and point desktopApp/build.gradle.kts at it"
          exit 1
        fi
        ls -la libmpv-source

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-read-only: true

    - name: Run tests
      run: ./gradlew :library:jvmTest :shared:jvmTest

    # The app knows its full version, pre-release included, for the update check. The MSI version
    # takes the run number as its last part: Windows only upgrades to a higher MSI version, and two
    # releases of one version, such as 4.8.0-beta.1 and 4.8.0-beta.2, must still upgrade
    - name: Choose the build's versions
      run: |
        version=${TAG#v}
        core=${version%%-*}
        echo "VERSIONS=-PappVersion=$version -PmsiVersion=${core%.*}.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

    - name: Build MSI
      if: vars.ARTIFACT_SIGNING_ACCOUNT == ''
      run: ./gradlew :desktopApp:packageMsi $VERSIONS

    # Signed: the app is built first, its CloudStream.exe signed, and then the installer built around it
    - name: Build the app
      if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
      run: ./gradlew :desktopApp:createDistributable $VERSIONS

    - name: Sign in to Azure
      if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
      uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        allow-no-subscriptions: true

    - name: Sign CloudStream.exe
      if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
      uses: azure/artifact-signing-action@v2
      with:
        endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
        signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        files: ${{ github.workspace }}\desktopApp\build\compose\binaries\main\app\CloudStream\CloudStream.exe
        description: CloudStream
        description-url: ${{ github.server_url }}/${{ github.repository }}

    - name: Build MSI from the signed app
      if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
      run: ./gradlew :desktopApp:packageMsiFromAppImage $VERSIONS

    - name: Sign MSI
      if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
      uses: azure/artifact-signing-action@v2
      with:
        endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
        signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        files-folder: ${{ github.workspace }}\desktopApp\build\compose\binaries\main-from-app\msi
        files-folder-filter: msi
        description: CloudStream
        description-url: ${{ github.server_url }}/${{ github.repository }}

    - name: Check the signatures
      if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
      shell: pwsh
      run: |
        $files = @(Get-Item desktopApp\build\compose\binaries\main\app\CloudStream\CloudStream.exe) + @(Get-ChildItem desktopApp\build\compose\binaries\main-from-app\msi\*.msi)
        foreach ($file in $files) {
          $signature = Get-AuthenticodeSignature $file.FullName
          "$($file.Name): $($signature.Status), $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') { throw "$($file.Name) is not signed: $($signature.StatusMessage)" }
        }

    # Creates the tag on the merged commit when there is none yet
    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # The signed installer is built from the app folder, see above
        msi=$(ls desktopApp/build/compose/binaries/main-from-app/msi/*.msi 2> /dev/null || ls desktopApp/build/compose/binaries/main/msi/*.msi)
        prerelease=$([[ "$TAG" == *-* ]] && echo --prerelease || true)
        {
          echo "CloudStream for Windows ${TAG#v}."
          echo
          echo "Download \`$(basename "$msi")\` and open it to install, or to update an installed version. Installed apps also find this release in Settings."
          echo
          echo "SHA-256 of the installer: \`$(sha256sum "$msi" | cut -d' ' -f1)\`"
          echo
          echo "The \`*-source.7z.*\` files are the complete source of the libmpv-2.dll the app plays video with (GPL, see THIRD-PARTY-NOTICES.txt), with the list of every library's version in \`*-sources.txt\`."
        } > notes.md
        gh release create "$TAG" "$msi" libmpv-source/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
          --title "CloudStream ${TAG#v}" --notes-file notes.md --generate-notes \
          ${PREVIOUS:+--notes-start-tag "$PREVIOUS"} $prerelease
